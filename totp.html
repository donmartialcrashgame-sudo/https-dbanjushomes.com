<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Authenticator Security | DBH</title><link rel="icon" href="/dbh-logo.jpg"><link rel="stylesheet" href="/assets/css/styles.css"><style>.totp-wrap{width:min(760px,calc(100% - 28px));margin:auto;padding:32px 0 80px}.totp-card{background:#fff;border:1px solid #dfe8f2;border-radius:24px;padding:26px;box-shadow:0 16px 50px rgba(7,48,101,.08)}.totp-hero{background:linear-gradient(135deg,#062e67,#0b63ce);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px}.k{font-size:11px;font-weight:900;letter-spacing:.18em;color:#d7ebff}.totp-hero h1{margin:8px 0;font-size:clamp(28px,5vw,42px)}.totp-hero p{margin:0;color:#e5f2ff;line-height:1.6}.state{padding:13px 15px;border-radius:12px;background:#f5f9fd;color:#60758d;font-size:13px;margin-bottom:18px}.state.ok{background:#eaf8f0;color:#137d4d}.state.err{background:#fff0f0;color:#a02f2f}.setup{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}.qr{border:1px solid #e0e8f1;border-radius:16px;padding:12px;text-align:center}.qr img{width:190px;height:190px;max-width:100%}.secret{font-family:ui-monospace,monospace;background:#f4f7fa;border-radius:9px;padding:11px;word-break:break-all;font-size:12px}.field{display:block;margin:16px 0}.field span{display:block;font-weight:800;font-size:12px;margin-bottom:7px}.field input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #cdd9e7;border-radius:11px;font-size:20px;letter-spacing:.28em;text-align:center}.actions{display:flex;gap:10px;flex-wrap:wrap}.btnx{border:0;border-radius:11px;padding:12px 16px;font-weight:850;cursor:pointer;background:#0b63ce;color:#fff}.btnx.alt{background:#eef5fc;color:#0b63ce}.btnx.danger{background:#fff0f0;color:#a02f2f}.note{font-size:12px;line-height:1.6;color:#6b7f96;margin-top:14px}@media(max-width:650px){.totp-wrap{width:calc(100% - 18px);padding-top:18px}.totp-card{padding:18px}.setup{grid-template-columns:1fr}.qr{max-width:220px;margin:auto}}</style></head><body><header class="site-header" aria-label="DBH site navigation"></header><main class="totp-wrap"><section class="totp-hero"><div class="k">TWO-FACTOR AUTHENTICATION</div><h1>Authenticator app security.</h1><p>Protect your DBH account with a 6-digit code from Google Authenticator, Microsoft Authenticator, Authy, or another TOTP app.</p></section><section class="totp-card"><div id="state" class="state">Checking account security…</div><div id="content"></div></section></main><script src="/assets/js/config.js"></script><script src="/assets/js/app.js?v=20261002-14"></script><script type="module">
const C=window.DBH_CONFIG||{},state=document.getElementById('state'),content=document.getElementById('content');let sb,factorId,next=new URLSearchParams(location.search).get('redirect')||'/dashboard.html';
const get=()=>{try{return JSON.parse(localStorage.getItem('dbh_session')||'null')}catch{return null}};const msg=(t,c='')=>{state.textContent=t;state.className='state'+(c?' '+c:'')};
async function client(){if(sb)return sb;const m=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=m.createClient(C.supabaseUrl,C.supabaseAnonKey,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});return sb}
async function save(){const {data}=await sb.auth.getSession(),old=get()||{};if(data?.session)localStorage.setItem('dbh_session',JSON.stringify({...old,...data.session,authenticated:true,user:data.session.user||old.user}))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function init(){const s=get();if(!s?.access_token||!s?.refresh_token){location.href='/login.html?redirect='+encodeURIComponent(location.pathname+location.search);return}sb=await client();const set=await sb.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});if(set.error)throw set.error;await save();const f=await sb.auth.mfa.listFactors();if(f.error)throw f.error;const active=(f.data?.totp||[]).find(x=>x.status==='verified');if(active){factorId=active.id;const a=await sb.auth.mfa.getAuthenticatorAssuranceLevel();if(a.data?.currentLevel==='aal2')verified();else challenge()}else enrollStart()}
function enrollStart(){msg('TOTP is not enabled for this account.');content.innerHTML='<h2>Enable authenticator protection</h2><p class="note">Set up an authenticator app. TOTP is optional until you enable it.</p><div class="actions"><button class="btnx" id="start">Set up TOTP</button></div>';document.getElementById('start').onclick=enroll}
async function enroll(){msg('Creating your secure authenticator setup…');try{const r=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'DBH Authenticator'});if(r.error)throw r.error;factorId=r.data.id;const qr=r.data.totp?.qr_code||'',secret=r.data.totp?.secret||'';content.innerHTML='<div class="setup"><div class="qr"><img id="qr" alt="DBH authenticator QR code"></div><div><h2>Scan the QR code</h2><p class="note">If scanning is unavailable, enter this setup key manually.</p><div class="secret">'+esc(secret)+'</div><label class="field"><span>6-digit code</span><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></label><div class="actions"><button class="btnx" id="verify">Enable TOTP</button><button class="btnx alt" id="cancel">Cancel</button></div></div></div><p class="note">DBH does not receive or store the authenticator code you type here.</p>';document.getElementById('qr').src=qr.startsWith('data:')?qr:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(qr);document.getElementById('verify').onclick=verifyEnroll;document.getElementById('cancel').onclick=enrollStart;document.getElementById('code').focus();msg('Your authenticator is ready to verify.')}catch(e){msg(e.message||'Unable to start TOTP setup.','err')}}
async function verifyEnroll(){const code=document.getElementById('code')?.value.trim();if(!/^\d{6}$/.test(code||'')){msg('Enter the 6-digit code from your authenticator app.','err');return}msg('Verifying your authenticator…');try{const r=await sb.auth.mfa.challengeAndVerify({factorId,code});if(r.error)throw r.error;await save();msg('TOTP is enabled. This session is verified.','ok');verified();setTimeout(()=>location.href=next,500)}catch(e){msg(e.message||'That code was not accepted.','err')}}
function challenge(){msg('TOTP is enabled. Enter your authenticator code to continue.');content.innerHTML='<h2>Verify your identity</h2><p class="note">Open your authenticator app and enter the current 6-digit DBH code.</p><label class="field"><span>Authenticator code</span><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></label><div class="actions"><button class="btnx" id="verify">Verify and continue</button></div><p class="note">If you no longer have access to your authenticator, contact DBH support. Do not share your code.</p>';document.getElementById('verify').onclick=verifyChallenge;document.getElementById('code').focus()}
async function verifyChallenge(){const code=document.getElementById('code')?.value.trim();if(!/^\d{6}$/.test(code||'')){msg('Enter the 6-digit code from your authenticator app.','err');return}msg('Checking your code…');try{const r=await sb.auth.mfa.challengeAndVerify({factorId,code});if(r.error)throw r.error;await save();msg('Identity verified.','ok');verified();setTimeout(()=>location.href=next,450)}catch(e){msg(e.message||'That code was not accepted.','err')}}
function verified(){content.innerHTML='<h2>Authenticator protection is active</h2><p class="note">Your current session has passed the second-factor check.</p><div class="actions"><button class="btnx danger" id="disable">Disable TOTP</button><button class="btnx alt" id="continue">Continue</button></div>';document.getElementById('continue').onclick=()=>location.href=next;document.getElementById('disable').onclick=disable}
async function disable(){if(!factorId||!confirm('Disable TOTP protection for this DBH account?'))return;msg('Removing authenticator protection…');try{const r=await sb.auth.mfa.unenroll({factorId});if(r.error)throw r.error;await save();msg('TOTP has been disabled.','ok');enrollStart()}catch(e){msg(e.message||'Unable to disable TOTP.','err')}}
init().catch(e=>{console.error(e);msg(e.message||'Unable to load account security.','err');content.innerHTML='<p class="note">Please return to sign in and try again.</p><div class="actions"><a class="btnx" href="/login.html">Return to sign in</a></div>'});
</script></body></html>
