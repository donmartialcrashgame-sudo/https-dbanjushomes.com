<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List a Property | DBH Homes</title><link rel="icon" href="/dbh-logo.jpg"><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/consent.css"></head><body><header class="site-header" aria-label="DBH site navigation"></header><main class="page narrow"><div class="page-heading"><span class="eyebrow">FOR OWNERS & AGENTS</span><h1>List a property</h1><p>Property submissions go through review before publication.</p></div><form id="listing-form" class="form-card"><label>Property title<input name="title" required></label><label>Property type<select name="propertyType" id="listing-type" required><option value="">Loading types…</option></select></label><label>State<input name="state" required></label><label>City / Area<input name="location" required></label><label>Price<input name="price" type="number" min="0" required></label><label>Currency<select name="currency" required><option value="NGN">₦ NGN — Nigerian Naira</option><option value="USD">$ USD — US Dollar</option><option value="GBP">£ GBP — British Pound</option><option value="EUR">€ EUR — Euro</option><option value="CAD">CA$ CAD — Canadian Dollar</option></select></label><div class="two-col"><label>Bedrooms<input name="bedrooms" type="number" min="0"></label><label>Bathrooms<input name="bathrooms" type="number" min="0"></label></div><label>Description<textarea name="description" rows="7" required></textarea><label>Photos<input name="images" type="file" accept="image/*" multiple required></label><label>Legal document (PDF, optional)<input name="legal_document" id="legal-document" type="file" accept="application/pdf"></label><div class="two-col"><label>Document type<input name="document_type" id="document-type" placeholder="e.g. Deed of Assignment"></label><label>Document reference<input name="document_reference" id="document-reference" placeholder="Optional reference"></label></div><label>Issuing authority<input name="issuing_authority" id="issuing-authority" placeholder="Optional issuing authority"></label><button class="btn btn-primary" type="submit">Submit for review</button><p id="listing-message" class="form-message"></p></form></main><script src="/assets/js/config.js"></script><script src="/assets/js/app.js?v=20261001-10"></script><script type="module" src="/assets/js/listing.js"></script></body></html>
