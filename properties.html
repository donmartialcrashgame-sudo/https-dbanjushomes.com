<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Properties for Sale | DBH Homes</title><meta name="description" content="Browse approved properties for sale from DBH Homes."><link rel="icon" href="/dbh-logo.jpg"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="DBH Homes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/notifications.css"><link rel="stylesheet" href="/assets/css/consent.css"><style>
.properties-market{max-width:1380px;margin:0 auto;padding:38px 30px 90px;position:relative}

.panel{border-radius:18px!important}
