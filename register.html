<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | DBH Homes</title><link rel="icon" href="/dbh-logo.jpg"><link rel="stylesheet" href="/assets/css/styles.css"><link rel="stylesheet" href="/assets/css/consent.css"></head><body class="auth-page"><main class="auth-shell"><a class="brand auth-brand" href="/"><img src="/dbh-logo.jpg" alt="DBH"></a><section class="auth-card"><span class="eyebrow">JOIN DBH</span><h1>Create your account</h1><form id="register-form"><label>Full name<input name="fullName" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Account type<select name="role"><option value="buyer">Property seeker</option><option value="owner">Property owner</option><option value="agent">Agent</option></select></label><button class="btn btn-primary" type="submit">Create account</button><p id="auth-message" class="form-message"></p></form><p>Already registered? <a href="/login.html">Sign in</a></p></section></main><script src="/assets/js/config.js"></script><script src="/assets/js/app.js"></script><script type="module" src="/assets/js/auth.js"></script></body></html>
