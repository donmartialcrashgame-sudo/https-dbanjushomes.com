<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing you in | DBH</title>
<link rel="icon" href="/dbh-logo.jpg">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/config.js"></script>
</head>
<body class="dbh-callback-page">
<main class="dbh-callback-card">
  <img src="/dbh-logo.jpg" alt="DBH" class="dbh-callback-logo">
  <div class="dbh-callback-spinner" id="callback-spinner"></div>
  <div class="auth-hero-badge">SECURE ACCOUNT</div>
  <h1 id="callback-title">Welcome to DBH</h1>
  <p id="callback-message">Checking your DBH session…</p>
  <div id="callback-error" class="dbh-callback-error" hidden></div>
  <a id="callback-back" class="btn btn-primary" href="/login.html" hidden>Return to sign in</a>
</main>
<script>
(async function(){
  const title=document.getElementById('callback-title');
  const msg=document.getElementById('callback-message');
  const error=document.getElementById('callback-error');
  const spinner=document.getElementById('callback-spinner');
  const back=document.getElementById('callback-back');

  try{
    const session=(()=>{try{return JSON.parse(localStorage.getItem('dbh_session')||'null')}catch{return null}})();
    const api=(window.DBH_CONFIG?.apiBaseUrl||'').replace(/\/$/,'');
    const headers={Accept:'application/json'};
    if(session?.sessionToken)headers.Authorization='Bearer '+session.sessionToken;
    const r=await fetch(api+'/api/auth/session',{credentials:'include',headers});
    const data=await r.json().catch(()=>({}));
    if(!r.ok||!data?.authenticated||!data?.user)throw new Error(data?.message||'Your DBH session could not be verified.');

    const current=(()=>{try{return JSON.parse(localStorage.getItem('dbh_session')||'null')}catch{return null}})();
    localStorage.setItem('dbh_session',JSON.stringify({
      authenticated:true,
      provider:data.user.provider||current?.provider||'google',
      user:data.user,
      sessionToken:sessionToken
    }));

    title.textContent='You are all set';
    msg.textContent='Opening your DBH account…';
    setTimeout(()=>location.replace('/dashboard.html'),350);
  }catch(e){
    spinner.style.display='none';
    title.textContent='We could not finish setup';
    msg.textContent=e.message||'Please try signing in again.';
    error.hidden=false;
    error.textContent='Google sign-in reached DBH, but the DBH session could not be prepared.';
    back.hidden=false;
  }
})();
</script>
</body>
</html>
