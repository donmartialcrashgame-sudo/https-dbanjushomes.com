t('div');gallery.className='detail-gallery-modal';gallery.id='detail-gallery-modal';gallery.innerHTML='<div class="gallery-modal-head"><div class="gallery-modal-title"><strong>Property photos</strong><span class="gallery-modal-counter" id="gallery-modal-counter"></span></div><button class="gallery-modal-close" id="gallery-modal-close" type="button">×</button></div><div class="gallery-modal-stage"><button class="gallery-arrow prev" id="gallery-prev" type="button">‹</button><div class="gallery-modal-image-wrap"><img id="gallery-modal-image" class="gallery-modal-image" alt=""><div class="gallery-watermark">'+(c.watermarkLogoUrl?'<img src="'+esc(c.watermarkLogoUrl)+'" alt="">':'')+'<span>'+esc(c.watermarkName||'D Banjus Homes Nig Ltd')+'</span></div>'+(verified?'<div class="gallery-verified">'+icon('shield')+' Verified Property</div>':'')+'</div><button class="gallery-arrow next" id="gallery-next" type="button">›</button></div><div class="gallery-modal-thumbs" id="gallery-modal-thumbs"></div></div>';document.body.appendChild(gallery);const shareButton=document.getElementById('share-property');shareButton?.addEventListener('click',async()=>{try{if(navigator.share){await navigator.share({title:p.title,text:'View this property on DBH — D Banjus Homes Nig Ltd',url:location.href});}else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert('Property link copied.');}}catch(e){if(e&&e.name!=='AbortError')console.warn('DBH share:',e);}});const reportButton=document.getElementById('report-property');reportButton?.addEventListener('click',()=>{const reason=prompt('What would you like to report?\n\n1. Wrong information\n2. Property unavailable\n3. Suspicious listing\n4. Wrong price','1');if(!reason)return;const subject=encodeURIComponent('DBH Property Report - '+(p.property_code||p.id||p.title));const body=encodeURIComponent('Property: '+location.href+'\nReport reason: '+reason+'\n\nPlease review this listing.');location.href='mailto:support@dbanjushomes.com?subject='+subject+'&body='+body;});document.querySelectorAll('.detail-photo').forEach(photo=>{const w=document.createElement('span');w.className='property-cover-watermark';w.style.left='10px';w.style.bottom='10px';w.style.padding='5px 7px';w.innerHTML=(c.watermarkLogoUrl?'<img src="'+esc(c.watermarkLogoUrl)+'" alt="">':'')+'<span>'+esc(c.watermarkName||'D Banjus Homes Nig Ltd')+'</span>';photo.appendChild(w);if(verified){const v=document.createElement('span');v.className='property-image-verified';v.style.right='10px';v.style.bottom='10px';v.innerHTML=icon('shield')+' Verified';photo.appendChild(v);}});const galleryImages=imgs;let galleryIndex=0;const modalImage=document.getElementById('gallery-modal-image'),counter=document.getElementById('gallery-modal-counter'),thumbs=document.getElementById('gallery-modal-thumbs');galleryImages.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.className='gallery-modal-thumb';b.innerHTML='<img src="'+esc(x)+'" alt="">';b.onclick=()=>showGallery(i);thumbs.appendChild(b);});function showGallery(i){if(!galleryImages.length)return;galleryIndex=(i+galleryImages.length)%galleryImages.length;modalImage.src=galleryImages[galleryIndex];modalImage.alt=p.title+' image '+(galleryIndex+1);counter.textContent=(galleryIndex+1)+' / '+galleryImages.length;thumbs.querySelectorAll('.gallery-modal-thumb').forEach((b,n)=>b.classList.toggle('active',n===galleryIndex));gallery.classList.add('open');document.body.style.overflow='hidden';}document.getElementById('view-all-photos')?.addEventListener('click',()=>showGallery(0));document.getElementById('gallery-modal-close').onclick=()=>{gallery.classList.remove('open');document.body.style.overflow='';};document.getElementById('gallery-prev').onclick=()=>showGallery(galleryIndex-1);document.getElementById('gallery-next').onclick=()=>showGallery(galleryIndex+1);document.addEventListener('keydown',e=>{if(!gallery.classList.contains('open'))return;if(e.key==='Escape')document.getElementById('gallery-modal-close').click();if(e.key==='ArrowLeft')showGallery(galleryIndex-1);if(e.key==='ArrowRight')showGallery(galleryIndex+1);});document.querySelectorAll('.detail-thumb,.detail-photo').forEach(b=>b.addEventListener('click',()=>{document.getElementById('detail-cover-image').src=b.dataset.img;document.querySelectorAll('.detail-thumb').forEach(x=>x.classList.toggle('active',x.dataset.img===b.dataset.img));}));
