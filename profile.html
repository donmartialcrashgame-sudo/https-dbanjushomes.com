<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5ed7"><meta name="description" content="Manage your DBH Homes profile and account information.">
<title>My Profile | DBH — D Banjus Homes Nig Ltd</title>
<link rel="icon" href="/dbh-logo.jpg"><link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
.dbh-profile-page{max-width:1120px;margin:0 auto;padding:38px 24px 90px}.profile-hero{border:1px solid #dfe8f2;border-radius:28px;background:linear-gradient(135deg,#0b5ed7,#073b82);color:#fff;padding:34px;display:flex;align-items:center;justify-content:space-between;gap:24px;box-shadow:0 22px 60px rgba(9,45,99,.13)}.profile-hero h1{margin:5px 0 8px;font-size:clamp(30px,4vw,46px);letter-spacing:-.04em}.profile-hero p{margin:0;color:#dceaff;line-height:1.7;font-size:13px}.profile-avatar-lg{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0b5ed7;font-size:30px;font-weight:950;box-shadow:0 12px 30px rgba(0,0,0,.16);flex:none}.profile-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:20px;margin-top:20px}.profile-card{background:#fff;border:1px solid #dfe8f2;border-radius:24px;padding:26px;box-shadow:0 18px 50px rgba(9,45,99,.06)}.profile-card h2{margin:0 0 5px;font-size:20px}.profile-card>p{margin:0 0 22px;color:#74879d;font-size:12px;line-height:1.6}.profile-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.profile-field{display:grid;gap:7px}.profile-field.full{grid-column:1/-1}.profile-field label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#5c7692}.profile-field input{border:1px solid #d7e1ec;border-radius:13px;padding:13px 14px;color:#18324f;background:#fbfdff;font:inherit;outline:none}.profile-field input:focus{border-color:#72a7e8;box-shadow:0 0 0 4px rgba(11,94,215,.08)}.profile-field input[readonly]{cursor:not-allowed;color:#6d8198}.profile-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.profile-status{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:12px}.profile-status.show{display:block}.profile-status.ok{background:#ebf8ef;color:#176b40;border:1px solid #c8e8d3}.profile-status.error{background:#fff2f3;color:#9d3038;border:1px solid #f1cdd1}.account-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #e6edf4}.account-item:last-child{border-bottom:0}.account-icon{width:40px;height:40px;border-radius:12px;background:#edf5ff;color:#0b5ed7;display:grid;place-items:center}.account-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.account-item strong{display:block;font-size:12px;color:#193653}.account-item span{display:block;font-size:11px;color:#74879d;margin-top:3px;line-height:1.4}.profile-links{display:grid;gap:9px;margin-top:18px}.profile-links a{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border:1px solid #dfe8f2;border-radius:13px;color:#25435f;font-weight:800;font-size:12px;text-decoration:none}.profile-links a:hover{border-color:#9fc2eb;background:#f6faff}.profile-links b{color:#0b5ed7}.profile-logged-out{max-width:560px;margin:80px auto;text-align:center}.profile-logged-out h1{font-size:34px;margin:0 0 10px}.profile-logged-out p{color:#71859c;line-height:1.7;font-size:13px}.profile-logged-out .profile-actions{justify-content:center}@media(max-width:820px){.profile-grid{grid-template-columns:1fr}.profile-hero{align-items:flex-start}.profile-avatar-lg{width:72px;height:72px;font-size:23px}}@media(max-width:600px){.dbh-profile-page{padding:24px 14px 60px}.profile-hero{padding:24px;flex-direction:column}.profile-avatar-lg{order:-1}.profile-fields{grid-template-columns:1fr}.profile-field.full{grid-column:auto}.profile-card{padding:20px}}
</style>
</head>
<body>
<div id="app-loader" class="app-loader" aria-hidden="false"><div class="loader-ring"></div><div class="loader-ring r2"></div><img src="/dbh-logo.jpg" alt="DBH"><p>Dream it, we build it.</p></div>
<header class="site-header" aria-label="DBH site navigation"></header>
<main class="with-right-sidebar"><div class="dbh-profile-page">
<section id="profile-content"></section>
</div></main>
<script src="/assets/js/config.js?v=20260930-1"></script>
<script src="/assets/js/app.js?v=20261001-6"></script>
<script>
(function(){
'use strict';
const root=document.getElementById('profile-content');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function initials(name){return String(name||'DB').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'DB'}
function session(){try{return JSON.parse(localStorage.getItem('dbh_session')||'null')}catch{return null}}
function render(user){
 if(!user){root.innerHTML='<section class="profile-card profile-logged-out"><h1>Sign in to your profile</h1><p>Your DBH profile is available after you sign in. Use your DBH account to manage your personal information and saved properties.</p><div class="profile-actions"><a class="btn btn-primary" href="/login.html?redirect=/profile.html">Sign In</a><a class="btn btn-outline" href="/register.html">Create account</a></div></section>';return}
 const name=user.name||user.full_name||user.user_metadata?.full_name||user.user_metadata?.name||user.email?.split('@')[0]||'DBH User';
 const email=user.email||''; const phone=user.phone||user.phone_number||'';
 const first=name.split(/\s+/)[0]||''; const last=name.split(/\s+/).slice(1).join(' ');
 root.innerHTML='<section class="profile-hero"><div><span class="eyebrow" style="color:#dceaff">MY ACCOUNT</span><h1>Welcome, '+esc(first||name)+'.</h1><p>Manage your DBH account information and keep your property journey in one place.</p></div><div class="profile-avatar-lg" aria-label="Profile avatar">'+esc(initials(name))+'</div></section>'+
 '<div class="profile-grid"><section class="profile-card"><h2>Personal information</h2><p>Keep your name and contact details up to date.</p><form id="profile-form"><div class="profile-fields"><div class="profile-field"><label for="profile-first">First name</label><input id="profile-first" name="first" value="'+esc(first)+'" required></div><div class="profile-field"><label for="profile-last">Last name</label><input id="profile-last" name="last" value="'+esc(last)+'"></div><div class="profile-field full"><label for="profile-email">Email address</label><input id="profile-email" value="'+esc(email)+'" readonly></div><div class="profile-field full"><label for="profile-phone">Phone number</label><input id="profile-phone" name="phone" value="'+esc(phone)+'" placeholder="+234 …"></div></div><div id="profile-status" class="profile-status"></div><div class="profile-actions"><button class="btn btn-primary" type="submit">Save changes</button><a class="btn btn-outline" href="/save.html">Saved properties</a></div></form></section>'+
 '<aside class="profile-card"><h2>Account</h2><p>Your DBH account and property activity.</p><div class="account-item"><div class="account-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"></circle><path d="M5 20c.7-4 2.8-6 7-6s6.3 2 7 6"></path></svg></div><div><strong>Account type</strong><span>Property Seeker</span></div></div><div class="account-item"><div class="account-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"></path><path d="m4 7 8 6 8-6"></path></svg></div><div><strong>Email</strong><span>'+esc(email||'Not provided')+'</span></div></div><div class="account-item"><div class="account-icon"><svg viewBox="0 0 24 24"><path d="M5 4h3l2 5-2 2c1.2 2.4 2.6 3.8 5 5l2-2 5 2v3c0 1-0.8 2-2 2C11.2 20 4 12.8 4 5c0-1 .8-1 1-1Z"></path></svg></div><div><strong>Phone</strong><span>'+esc(phone||'Not provided')+'</span></div></div><div class="profile-links"><a href="/dashboard.html">Dashboard <b>›</b></a><a href="/save.html">Saved properties <b>›</b></a><a href="/properties.html">Browse properties <b>›</b></a></div></aside></div>';
 const form=document.getElementById('profile-form'); const status=document.getElementById('profile-status');
 form.addEventListener('submit',async e=>{
   e.preventDefault(); status.className='profile-status'; status.textContent='';
   const fd=new FormData(form); const fullName=[fd.get('first'),fd.get('last')].filter(Boolean).join(' ').trim();
   const updated={...user,name:fullName,full_name:fullName,phone:String(fd.get('phone')||'').trim()};
   try{
     localStorage.setItem('dbh_session',JSON.stringify({...session(),user:updated}));
     status.className='profile-status show ok'; status.textContent='Your profile has been updated on this device.';
     if(window.bootShell)window.bootShell();
   }catch(err){status.className='profile-status show error';status.textContent='Unable to update your profile.'}
 });
}
render(session()?.user||null);
})();
</script>
</body></html>
